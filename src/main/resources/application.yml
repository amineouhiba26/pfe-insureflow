spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8180/realms/insureflow
          jwk-set-uri: http://localhost:8180/realms/insureflow/protocol/openid-connect/certs

  main:
    allow-bean-definition-overriding: true

  application:
    name: insureflow

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

  datasource:
    url: jdbc:postgresql://localhost:5433/insureflow_db
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 20000
      idle-timeout: 300000
      max-lifetime: 600000        # reduce from default 1800000
      keepalive-time: 60000       # ping connections every 60s
      connection-test-query: SELECT 1

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  rabbitmq:
    host: localhost
    port: 5672
    username: insureflow
    password: insureflow

  ai:
    ollama:
      base-url: http://localhost:11434
      chat:
        model: llama3.1:8b
        options:
          temperature: 0.1
      embedding:
        model: mxbai-embed-large
    vectorstore:
      pgvector:
        initialize-schema: true
        dimensions: 1024
        distance-type: COSINE_DISTANCE
        index-type: HNSW

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

logging:
  level:
    root: WARN
    com.insureflow: INFO
    org.springframework.security: WARN
    org.springframework.web: WARN
    org.hibernate.SQL: WARN

insureflow:
  rabbitmq:
    exchange: insureflow.claims
    queues:
      intake:    claim.intake
      routed:    claim.routed
      validated: claim.validated
      estimated: claim.estimated
      fraud:     claim.fraud.checked
      decision:  claim.decision
      review:    claim.human.review

langchain4j:
  ollama:
    chat-model:
      enabled: false
      base-url: http://localhost:11434
      model-name: llama3.1:8b
      temperature: 0.1
      timeout: 120s

cloudinary:
  cloud-name: dmqevyefl
  api-key: REDACTED
  api-secret: REDACTED
  folder: insureflow-claims

serpapi:
  api-key: REDACTED

gemini:
  api-key: REDACTED

ollama:
  base-url: http://localhost:11434
  chat:
    model: llama3.1:8b
    timeout: 120
  vision:
    model: llama3.2-vision
    timeout: 300

keycloak:
  realm: insureflow
  auth-server-url: http://localhost:8180
  frontend-client-id: insureflow-frontend
  sync:
    enabled: true
  admin:
    client-id: admin-cli
    username: admin
    password: REDACTED
